name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Super-Linter
        uses: super-linter/super-linter@v8.7.0
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_JSX: true
          VALIDATE_CSS: true
          VALIDATE_HTML: true

  discord:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Run Discord Webhook (Action)
          uses: sebastianpopp/discord-action@v3
          with:
            webhook: ${{ secrets.DISCORD_WEBHOOK }}
            message: "🔔 Workflow de CI iniciado"

        - name: Notificar Discord com embed (curl)
          run: |
            curl -H "Content-Type: application/json" \
                -d '{
                  "embeds": [{
                    "title": "✅ Build e testes passaram",
                    "url": "https://github.com/${{ github.repository }}/commit/${{ github.sha }}",
                    "description": "Repositório: **${{ github.repository }}**",
                    "color": 5814783,
                    "fields": [
                      {"name": "Autor", "value": "${{ github.actor }}", "inline": true},
                      {"name": "Commit", "value": "`${{ github.sha }}`", "inline": true}
                    ]
                  }]
                }' \
                ${{ secrets.DISCORD_WEBHOOK }}

  test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 20.x
            cache: 'npm'
        - run: npm ci
        - run: npm run test